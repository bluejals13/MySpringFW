myboot.name=Prod Env

logging.level.com.basic.myspringboot=info

# mariadb db info
spring.datasource.url=jdbc:mariadb://localhost:3306/lab_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=lab
spring.datasource.password=lab

# hibernate info
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

